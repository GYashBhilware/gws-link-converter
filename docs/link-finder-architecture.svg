  <line x1="563" y1="230" x2="563" y2="270" stroke="#c0c4c8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="395" y1="228" x2="362" y2="228" stroke="#5f6368" stroke-width="2"/>
  <line x1="172" y1="228" x2="208" y2="228" stroke="#5f6368" stroke-width="2"/>
  <text x="190" y="282" font-size="11" text-anchor="middle" fill="#3c4043">Google sign-in (IAP)</text>
