<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Row 1: migration (Google Workspace) -->
  <rect x="8" y="8" width="784" height="118" rx="10" fill="#f1f3f4" stroke="#dadce0" stroke-width="1.5"/>
  <text x="20" y="28" font-size="13" font-weight="bold" fill="#3c4043">1. Migration (Microsoft 365 → Google Workspace)</text>
  <rect x="30" y="48" width="190" height="60" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="125" y="74" font-size="14" text-anchor="middle" fill="#202124">SharePoint /</text>
  <text x="125" y="93" font-size="14" text-anchor="middle" fill="#202124">OneDrive files</text>
  <rect x="305" y="48" width="190" height="60" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="400" y="83" font-size="14" text-anchor="middle" fill="#202124">Google Drive</text>
  <rect x="580" y="48" width="190" height="60" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="675" y="74" font-size="14" text-anchor="middle" fill="#202124">Workspace audit log</text>
  <text x="675" y="93" font-size="12" text-anchor="middle" fill="#5f6368">old link + new link</text>
  <line x1="220" y1="78" x2="303" y2="78" stroke="#5f6368" stroke-width="2"/>
  <text x="262" y="70" font-size="11" text-anchor="middle" fill="#3c4043">Data Migration</text>
  <line x1="495" y1="78" x2="578" y2="78" stroke="#5f6368" stroke-width="2"/>
  <text x="537" y="70" font-size="11" text-anchor="middle" fill="#3c4043">records</text>

  <!-- Row 2: Link Finder (customer's Google Cloud project) -->
  <rect x="8" y="150" width="784" height="142" rx="10" fill="#e6f4ea" stroke="#a8dab5" stroke-width="1.5"/>
  <text x="20" y="170" font-size="13" font-weight="bold" fill="#137333">2. Link Finder (runs in the customer's own Google Cloud project)</text>
  <rect x="580" y="198" width="190" height="60" rx="10" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="675" y="224" font-size="14" text-anchor="middle" fill="#202124">BigQuery</text>
  <text x="675" y="243" font-size="12" text-anchor="middle" fill="#5f6368">audit log export</text>
  <rect x="395" y="198" width="150" height="60" rx="10" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="470" y="224" font-size="14" text-anchor="middle" fill="#202124">Lookup tables</text>
  <text x="470" y="243" font-size="12" text-anchor="middle" fill="#5f6368">(BigQuery)</text>
  <rect x="210" y="198" width="150" height="60" rx="10" fill="#ffffff" stroke="#188038" stroke-width="1.5"/>
  <text x="285" y="224" font-size="14" text-anchor="middle" fill="#202124">Link Finder app</text>
  <text x="285" y="243" font-size="12" text-anchor="middle" fill="#5f6368">(Cloud Run)</text>
  <rect x="30" y="198" width="140" height="60" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
