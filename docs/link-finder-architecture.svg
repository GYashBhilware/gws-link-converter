  <text x="100" y="243" font-size="12" text-anchor="middle" fill="#5f6368">pastes old link</text>

  <line x1="675" y1="108" x2="675" y2="196" stroke="#5f6368" stroke-width="2"/>
  <text x="683" y="145" font-size="11" fill="#3c4043">BigQuery Export</text>
  <line x1="580" y1="228" x2="547" y2="228" stroke="#5f6368" stroke-width="2"/>
